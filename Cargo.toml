[workspace]
resolver = "2"
members = ["bark-proto", "bark-driver", "bark-sim"]
# bark-fw targets thumbv7em-none-eabihf and is its own workspace; see README.
exclude = ["bark-fw"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/zond/bark"

[profile.release]
debug = 1
