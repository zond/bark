[workspace]
resolver = "2"
members = ["bark-proto", "bark-driver", "bark-sim", "bark-image"]
# bark-fw and bark-loader target thumbv7em-none-eabihf and are each their own
# workspace; see README.
exclude = ["bark-fw", "bark-loader"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/zond/bark"

[profile.release]
debug = 1
