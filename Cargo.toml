[workspace]
resolver = "2"
members = ["bark-proto", "bark-driver", "bark-sim", "bark-image", "bark-link", "bark-screen", "bark-app-layer"]
# bark-fw and bark-loader target thumbv7em-none-eabihf and are each their own
# workspace; see README.
exclude = ["bark-fw", "bark-loader"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/zond/bark"

[profile.release]
debug = 1

# The swap's power-cut tests (bark-image, boot::tests) copy the 908 KiB
# slot over a thousand times: optimised, they take seconds, not a minute.
[profile.dev.package.bark-image]
opt-level = 2
[profile.dev.package.embassy-boot]
opt-level = 2
[profile.dev.package.sha2]
opt-level = 2
