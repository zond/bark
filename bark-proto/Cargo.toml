[package]
name = "bark-proto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Sans-IO protocol core for the bark 433 MHz LoRa mesh: codecs, tables, routing, MAC."

[dependencies]
libm = "0.2"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[features]
default = []
# Enables std-only conveniences (Debug printing helpers, Vec sinks) for the simulator and tests.
std = []
