# A ring: eight relays on an octagon with 400 m sides, numbered clockwise,
# each hearing only its two neighbours on the ring, and a leaf 50 m outside
# each relay. Leaf i sends to leaf i + 3 every 2 s, all from the same
# instant.
#
#            R0
#       R7        R1
#     R6            R2
#       R5        R3
#            R4
#
# Clockwise the destination is three hand-overs between relays away, the
# other way five. So every relay takes messages from the relay behind it
# and hands them to the relay ahead, and a relay in the middle of a path
# holds messages for a relay whose send queue fills from the same flows:
# waiting messages could close a circle round the ring.

name = "ring"
seed = 1
duration_s = 1800.0
# As S1: the relays know each other one worst-case rotation (13
# heartbeats at 15 s) after their 150 s boot listen (protocol §6.2, §7).
settle_s = 345.0

[origin]
lat = 50.45
lon = 30.52

