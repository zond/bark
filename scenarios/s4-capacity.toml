# S4: one collision domain of the city model (protocol §13), for the
# capacity run of roadmap Phase 1 milestone 4. 28 km² with 269 relays and
# 20 000 phones indoors, texting at the rate §13 says the network carries,
# for one settled hour. docs/capacity-research-2026-10-15.md has the
# results and the source of every number.
#
# The texting rate is the variable of the run: the research note scales
# per_leaf_per_hour by 0.5, 2 and 4 with everything else unchanged.

name = "s4-capacity"
seed = 1
# One settled hour after the settle time.
duration_s = 4500.0
# The relays choose a home channel after their 150 s boot listen
# (protocol §6.2) and a leaf attaches within a worst-case rotation, 195 s,
# of its first heartbeat (§10.1); the move rule acts only on ten minutes
# of measurement (§6.3), so the first moves come after 750 s.
settle_s = 900.0

[origin]
lat = 50.45
lon = 30.52

[links]
model = "log_distance"
# S2's fit to the ranges of protocol §4 at SF5, 10 dBm and the -119 dBm
# default sensitivity, 129 dB of budget, with free-space loss at 1 m of
# 25.2 dB: 750 m to a handheld in the street gives n = 3.6, and 300 m to
# one indoors leaves 14.4 dB for the wall. A windowsill relay counts as
# outdoors: with a wall at both ends a relay would reach a leaf 120 m
# away, and §13's 9.6 relays per km² would leave most leaves without one.
exponent = 3.6
indoor_loss_db = 14.4
# Rooftop relays hear about 3 km (§4, §13): 129 - 25.2 - 36 log10(3000)
# = -21.4 dB, so a link between two rooftops has 21.4 dB less loss than
# the same link in the clutter. A rooftop relay's link to anything
# below the roofs gets no bonus.
rooftop_bonus_db = 21.4
shadowing_sigma_db = 6.0

[links.fading]
sigma_db = 4.0
correlation_time_s = 60.0
step_s = 10.0

# A square of 28 km² (§13): side 5291.5 m.
#
# Relays at §13's 9.6 per km² for indoor coverage. §13 gives no rooftop
# share; the rooftop ones here are its outdoor-only density, 1.9 per km²,
# the relays a city would put up first, 53 of the 269.
[[nodes]]
place = "density"
role = "relay"
width_m = 5291.5
height_m = 5291.5
per_km2 = 1.9
rooftop = true

[[nodes]]
place = "density"
role = "relay"
width_m = 5291.5
height_m = 5291.5
per_km2 = 7.7

# 20 000 phones with their leaves (§13: 300 000 users over 14 domains),
# all indoors.
[[nodes]]
place = "density"
role = "leaf"
width_m = 5291.5
height_m = 5291.5
per_km2 = 714.2857
indoor = true

# 23 texts per user per day (§13), 100 bytes each (§13's text), to any
# other leaf in the domain alike.
[[traffic]]
kind = "poisson"
per_leaf_per_hour = 0.9583333
payload_min = 100
payload_max = 100
destination = { kind = "uniform" }

# As S2: dark five minutes in an hour on average (§10.4).
[availability]
mean_available_s = 3300.0
mean_dark_s = 300.0

[metrics]
cadence_s = 1.0
observers = ["relay:*"]
per_node = true
