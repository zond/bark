# mesh-burst.toml's mesh with the same traffic spread out: each leaf
# starts at its own time within the first 600 s and keeps its rhythm.
# R18, the relay nearest the middle, restarts at 1500 s: it loses every
# table and boots again with the same position, as a solar relay does
# after a night, and the traffic must route around it while it listens
# and its neighbours relearn it.

# The 25 relays stand where a uniform draw put them in a 2.5 km square,
# at least 200 m apart, with one leaf 15 m from each. With S2's link model
# and its 6 dB shadowing, drawn per pair from the run's seed, each seed
# gives other links: holes the search must route around, and on some
# seeds (5 among 1 to 10) a relay that nothing reaches, whose messages
# are counted apart as unreachable. Every leaf i sends 60 bytes to leaf
# i + 12 (mod 25) every 600 s, so the flows cross the whole mesh. The
# first message waits until every leaf has attached: the relays' 195 s
# boot listen, up to a worst-case rotation (195 s) for a leaf to hear its
# first heartbeat, and a rotation more before it chooses (spec "Relay choice"),
# 585 s.

name = "mesh-spread"
seed = 1
duration_s = 2700.0
# As S1: the relays know each other one worst-case rotation (13
# heartbeats at 15 s) after their 195 s boot listen (spec "Channel at boot", "Heartbeat").
settle_s = 390.0

[origin]
lat = 50.45
lon = 30.52

[links]
# S2's log-distance model, without fading: what is measured is the
# protocol under load, not link noise.
model = "log_distance"
exponent = 3.6
indoor_loss_db = 14.4
shadowing_sigma_db = 6.0

