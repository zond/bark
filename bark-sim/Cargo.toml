[package]
name = "bark-sim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Discrete-event simulator and scenario runner for the bark mesh."

[dependencies]
bark-proto = { path = "../bark-proto", features = ["std"] }
# The mailbox a home node runs, as the firmware does (spec "Mailbox").
bark-app-layer = { path = "../bark-app-layer" }
# The firmware's rule for when a node reboots into an image it gathered
# (spec "Updates over the mesh", the install), and how long the swap takes.
bark-image = { path = "../bark-image" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
