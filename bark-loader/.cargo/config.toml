[build]
# nRF52840: Cortex-M4F.
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
rustflags = [
  # cortex-m-rt's linker script; it INCLUDEs memory.x (written to OUT_DIR by build.rs).
  "-C", "link-arg=-Tlink.x",
  # Do not page-align sections: the loader must start exactly where the
  # board's bootloader jumps.
  "-C", "link-arg=--nmagic",
]
