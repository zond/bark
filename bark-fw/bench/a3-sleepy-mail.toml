# A3, mail to and from a sleepy node (docs/bench-suite-2026-11-13.md,
# "Acceptance tests"): delivered in the node's window, and its own text
# arrives.
#
# S is built to report battery whatever USB says, so it is sleepy from its
# boot and still logs (docs/bringup-2026-11-06.md, "A sleepy node"). A and
# R are relays. S is deaf to A, so R is its anchor, and a text to S is
# addressed to R's place (spec "Sleepy nodes").

about = "a text to a sleepy node, delivered in its window, and one from it"
# The relays' first rotation, then a sleepy node's choice of its anchor,
# then the two texts; 15 min as the design gives it.
duration_s = 900.0

[[boards]]
name = "A"
place_m = -50.0

[[boards]]
name = "R"
place_m = 50.0

[[boards]]
name = "S"
place_m = 0.0
deaf_to = "A"
env = { BARK_ON_BATTERY = "1" }

[[boards]]
name = "D"
silent = true

[[actions]]
at_s = 300.0
board = "A"
do = "say"
command = "text ${S.id} ${R.lat} ${R.lon} to the sleepy node"
name = "as"
expect = '^bench: send id=(?P<id>[0-9a-f]{8}) .*taken'

[[actions]]
at_s = 360.0
board = "S"
do = "say"
command = "text ${A.id} ${A.lat} ${A.lon} from the sleepy node"
name = "sa"
expect = '^bench: send id=(?P<id>[0-9a-f]{8}) .*taken'

[[pass]]
board = "S"
line = '^message id=${as.id}$'
after = "as"
why = "at S"

# Handed to S by its holder, in its window or behind a long preamble
# (spec "Delivery"), whichever relay that is.
[[pass]]
any = [
  { board = "A", line = '^Delivered \{ msg_id: MsgId\(${as.id|dec}\), node: NodeId\(\[${S.id_dec}\]\), by: (Window|Long)' },
  { board = "R", line = '^Delivered \{ msg_id: MsgId\(${as.id|dec}\), node: NodeId\(\[${S.id_dec}\]\), by: (Window|Long)' },
]
why = "in S's window"

[[pass]]
board = "A"
line = '^message id=${sa.id}$'
after = "sa"
why = "S's own text at A"

[[pass]]
board = "S"
line = '^Role \{ sleepy: false'
absent = true
why = "S stays sleepy"
