# A5, sleepy update (docs/bench-suite-2026-11-13.md, "Acceptance tests"):
# a sleepy node installs the image and is sleepy again on it.
#
# R, a relay, holds the run's newest image and serves it; S takes it. A
# node is sleepy by its power, its battery and its motion, not by its
# image, so S cannot be built sleepy: the image it installs is R's. Told
# it is on battery, a still node on the bench's USB relays on, as its
# cell never reads low (run of 2026-11-14). So S's role is flipped as a
# long press flips it, at every boot, its first on the new image among
# them.

about = "a sleepy node installs a relay's image and is sleepy again on it"
# A sleepy node had the 38 blocks after 16 h 15 min, some 26 min a block
# (2026-11-16); four hours over that.
duration_s = 72000.0

[[boards]]
name = "S"
place_m = 0.0
on_boot = ["flip"]

# After S, so its version is higher.
[[boards]]
name = "R"
place_m = 0.0
serves = true

[[boards]]
name = "C"
silent = true

[[boards]]
name = "D"
silent = true

[[pass]]
board = "S"
line = '^update: version ${R.version} confirmed'
why = "installed and confirmed"

[[pass]]
board = "S"
line = '(image version |\bimage_version=)${R.version}\b'
last_boot = true
why = "running it at the end"

[[pass]]
board = "S"
line = '^Forced \{ sleepy: true'
last_boot = true
why = "sleepy again on it"

[[pass]]
board = "S"
line = '^(Forced|Role) \{ sleepy: false'
absent = true
why = "S stays sleepy"
