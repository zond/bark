[build]
# nRF52840: Cortex-M4F.
target = "thumbv7em-none-eabihf"
# The source paths in the image made independent of the checkout's place
# (the script says why). Relative to this directory's parent.
rustc-wrapper = "scripts/rustc-remap.sh"

[target.thumbv7em-none-eabihf]
rustflags = [
  # cortex-m-rt's linker script; it INCLUDEs memory.x (written to OUT_DIR by build.rs).
  "-C", "link-arg=-Tlink.x",
  # Do not page-align sections: the image must start exactly at its slot.
  "-C", "link-arg=--nmagic",
]
