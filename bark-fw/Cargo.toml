[package]
name = "bark-fw"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/zond/bark"
description = "bark firmware for the LILYGO T-Echo (nRF52840 + SX1262)."
publish = false

# Its own workspace: this crate only builds for thumbv7em-none-eabihf
# (roadmap decision D7), so the host workspace excludes it.
[workspace]
# The copied driver is a dependency, not a member: its tests need its own
# repository.
exclude = ["vendor"]

[features]
default = []
# Run the bring-up measurement console (README, Console) instead of the core.
console = []

[dependencies]
bark-proto = { path = "../bark-proto" }
bark-driver = { path = "../bark-driver" }
# The flash layout, and the staging and confirmation of an image.
bark-image = { path = "../bark-image" }
# A place for the 150 KiB relay outside every task's future and stack.
static_cell = "=2.1.1"

# `reset-pin-as-gpio`: without it, embassy-nrf's init writes UICR.PSELRESET
# to P0.18 when that register is erased, a permanent change only SWD can undo.
# With it, init only ever writes all-ones, a no-op on any UICR state, so this
# firmware never alters the reset-pin setting the bootloader left.
# `time-driver-rtc1`: nrf-sdc will take RTC0 (research doc spec "Summary").
# `unstable-pac`: the node ID is read from FICR (src/node.rs).
embassy-nrf = { version = "=0.11.0", features = ["nrf52840", "time-driver-rtc1", "gpiote", "reset-pin-as-gpio", "unstable-pac"] }
embassy-executor = { version = "=0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = "=0.5.1"
embassy-usb = "=0.6.0"
embassy-usb-logger = "=0.6.0"
embassy-futures = "=0.1.2"
embassy-sync = "=0.8.0"
# Debug and trace lines are left out of every build: the USB log's
# filter is info (`main.rs`), and the BLE host's would cost flash.
log = { version = "=0.4.34", features = ["max_level_info", "release_max_level_info"] }
# No critical-section feature: nrf-mpsl provides the implementation (below).
cortex-m = "=0.7.9"
# `set-vtor`: point VTOR at our vector table in the reset handler, so
# interrupts reach us directly instead of through MBR/SoftDevice forwarding.
cortex-m-rt = { version = "=0.7.7", features = ["set-vtor"] }
# With no debugger attached, a panic must survive into the next boot to be
# seen at all: panic-persist writes it to RAM (PANDUMP in memory.x) and
# soft-resets; main logs it over USB.
panic-persist = { version = "=0.3.0", features = ["utf8"] }
# SX1262 driver: a copy of lora-phy at lora-rs revision 7a9c2ec (2026-10-06),
# newer than crates.io 3.0.1 (roadmap D4, D20). That revision reports payload
# and header CRC failures as errors instead of handing the buffer up as a
# packet. vendor/README.md says how the copy is kept.
lora-phy = { path = "vendor/lora-phy" }
# The flash traits embassy-nrf's NVMC driver implements, for the stored
# state (src/store.rs), and the partitions that share the NVMC between it
# and the update (src/update.rs); their async forms, which the update's
# staging takes (src/update.rs, src/ext_flash.rs).
embedded-storage = "=0.3.2"
embedded-storage-async = "=0.4.2"
embassy-embedded-hal = "=0.6.0"
# The phone link (roadmap D5, D117; protocol.md "Phone link"): Nordic's
# SoftDevice Controller, peripheral-only, under the multiprotocol service
# layer (MPSL), and TrouBLE's host over it, a copy (vendor/README.md).
# `critical-section-impl`: a critical section that masks every interrupt
# but the three the MPSL's radio timing needs (RADIO, RTC0, TIMER0), for
# the console build too.
# `att-queued-writes`: long writes (D119). Without `log`: the host's own
# lines cost 9.9 KB of flash, which the GPS took (docs/gps-time-2026-11-05.md).
# `security`: pairing with a passkey and the bond (D135); P-256 in Rust, as
# the assembly one needs a C compiler in the build (docs/pairing-2026-11-06.md).
nrf-sdc = { version = "=0.4.0", features = ["nrf52840", "peripheral"] }
nrf-mpsl = { version = "=0.4.0", features = ["nrf52840", "critical-section-impl"] }
trouble-host = { path = "vendor/trouble-host", default-features = false, features = ["peripheral", "gatt", "derive", "default-packet-pool", "att-queued-writes", "security"] }
bark-link = { path = "../bark-link" }
# The mailbox and its ring (src/mailbox.rs).
bark-app-layer = { path = "../bark-app-layer" }
# What the e-paper shows, built and tested on the host (src/display.rs).
bark-screen = { path = "../bark-screen" }
# The GATT values' storage, the version trouble-host uses.
heapless = "=0.9.3"
# The clock the external flash's driver waits by (src/ext_flash.rs).
embedded-hal = "=1.0.0"
# The SpiDevice trait lora-phy takes, implemented over the SPIM bus driven blocking (src/radio.rs).
embedded-hal-async = "=1.0.0"

[build-dependencies]
# memory.x is written from the layout table.
bark-image = { path = "../bark-image", default-features = false }
# The built place is converted to counts by the core's conversion.
bark-proto = { path = "../bark-proto" }

# Debug info is not in the flash image; it names the functions for the
# stack measurement (README, Tasks and the stack). "z" over "s": 30 KB
# less of the 392 KiB slot (docs/flash-2026-11-06.md). With fat LTO it is
# this crate's level that counts; a dependency's own level only shapes its
# code before LTO.
[profile.release]
debug = 2
lto = "fat"
codegen-units = 1
opt-level = "z"
