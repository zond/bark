# Builds a release: the T-Echo firmware and the Android app, attached to a
# GitHub Release named after the tag.
#
# Not part of ci.yml. That one runs on every push and checks; this one
# builds what a person installs, with fat LTO and a signed APK, and
# only a tag needs that.
#
# A tag is `v<N>`, N a positive integer, the release's number. A release
# carries two versions that move apart (roadmap D164): the node firmware's
# image version F (bark-fw/README.md, "Updates"), which the update path
# only ever raises, and the app's version A, its version name and code,
# which Android also only ever raises. A side that changed since the
# previous release is built as version N; one that did not is carried on
# from the previous release, files and version unchanged, so that an app
# fix mints no image every node would gather and swap in for nothing, and
# a firmware fix makes no phone download the app again. The release says
# N, A and F in `release.json`, which the app reads.
#
# Nothing here may fail softly: a release missing a file, or carrying one
# that did not pass its check, is worse than no release.
name: Release

on:
  push:
    tags: ['v*']
  # A build on request, to see that it still works. Off a branch it builds
  # version 0, which the firmware takes as a bench build (bark-fw/README.md,
  # "Updates"), and makes no Release.
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.1

# A newer dispatch supersedes an older one on the same ref, but a tag build is
# never cancelled: it is the one whose files a Release is made of.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      n: ${{ steps.n.outputs.n }}
      prev: ${{ steps.sides.outputs.prev }}
      firmware: ${{ steps.sides.outputs.firmware }}
      app: ${{ steps.sides.outputs.app }}
      build_firmware: ${{ steps.sides.outputs.build_firmware }}
      build_app: ${{ steps.sides.outputs.build_app }}
    steps:
      # Checked here, once, so that a tag like `v1.2` stops the release
      # before anything is built, rather than becoming an image version the
      # firmware cannot parse or an APK version code Android refuses. Nine
      # digits at most: Android's version code stops at 2 100 000 000
      # (Android developer documentation, "Version your app").
      - id: n
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            n=${GITHUB_REF_NAME#v}
            case "$n" in
              '' | 0* | *[!0-9]* | ??????????*)
                echo "tag $GITHUB_REF_NAME is not v<N> with N a positive integer of at most nine digits"
                exit 1 ;;
            esac
          else
            n=0
          fi
          echo "version $n"
          echo "n=$n" >> "$GITHUB_OUTPUT"

      # The whole history and its tags, to compare with the previous
      # release's commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The previous release is the published one of the highest number
      # below N. Each side is built if its files changed since it
      # (scripts/release-changed.sh says which files), and otherwise
      # taken from it at the version it carries: from its release.json,
      # or, for a release from before the manifest, v21 and older, which
      # carried one version, from its files' names. A tag that changes
      # neither side makes no release. A bench build, N 0, builds both.
      - id: sides
        env:
          N: ${{ steps.n.outputs.n }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prev=
          if [ "$N" != 0 ]; then
            prev=$(gh release list --exclude-drafts --exclude-pre-releases \
                --limit 1000 --json tagName --jq '.[].tagName' \
              | sed -n 's/^v\([1-9][0-9]*\)$/\1/p' \
              | awk -v n="$N" '$1 + 0 < n + 0' | sort -n | tail -1)
          fi
          firmware=$N app=$N build_firmware=true build_app=true
          if [ -n "$prev" ]; then
            tag=v$prev
            names=$(gh release view "$tag" --json assets --jq '.assets[].name')
            if grep -qx release.json <<<"$names"; then
              gh release download "$tag" -p release.json -O "$RUNNER_TEMP/prev.json"
              prev_firmware=$(jq -r '.firmware' "$RUNNER_TEMP/prev.json")
              prev_app=$(jq -r '.app' "$RUNNER_TEMP/prev.json")
            else
              prev_firmware=$(sed -n 's/^bark-fw-\([1-9][0-9]*\)\.img$/\1/p' <<<"$names")
              prev_app=$(sed -n 's/^bark-\([1-9][0-9]*\)\.apk$/\1/p' <<<"$names")
            fi
            # Exit 0 changed, 1 unchanged; anything else stops the release.
            changed() {
              local rc=0
              scripts/release-changed.sh "$tag" HEAD "$1" || rc=$?
              [ "$rc" -le 1 ] || { echo "release-changed.sh $1 failed"; exit 1; }
              return "$rc"
            }
            # A version carried on is one the previous release names, a
            # positive number no higher than its own.
            carried() {
              case "$2" in
                '' | 0* | *[!0-9]*) echo "$tag names no $1 version: '$2'"; exit 1 ;;
              esac
              [ "$2" -le "$prev" ] || { echo "$tag names $1 version $2, above itself"; exit 1; }
            }
            if ! changed fw; then
              carried firmware "$prev_firmware"
              firmware=$prev_firmware build_firmware=false
            fi
            if ! changed app; then
              carried app "$prev_app"
              app=$prev_app build_app=false
            fi
            if [ "$build_firmware$build_app" = falsefalse ]; then
              echo "neither the firmware nor the app changed since $tag: no release"
              exit 1
            fi
          fi
          echo "previous release ${prev:-none}; firmware $firmware, built: $build_firmware; app $app, built: $build_app"
          {
            echo "prev=$prev"
            echo "firmware=$firmware"
            echo "app=$app"
            echo "build_firmware=$build_firmware"
            echo "build_app=$build_app"
          } >> "$GITHUB_OUTPUT"

  firmware:
    name: Firmware
    needs: version
    if: needs.version.outputs.build_firmware == 'true'
    runs-on: ubuntu-latest
    env:
      N: ${{ needs.version.outputs.n }}
      # Read by the firmware at build time (src/update.rs). No BARK_LAT or
      # BARK_LON: a released node takes its place from its GPS or from the
      # phone, never from the build.
      BARK_IMAGE_VERSION: ${{ needs.version.outputs.n }}
      ELF: target/thumbv7em-none-eabihf/release/bark-fw
      LOADER: ../bark-loader/target/thumbv7em-none-eabihf/release/bark-loader
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      # Two workspaces, each its own target directory: the firmware and the
      # loader are not members of the host workspace (README.md, "Building").
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            bark-fw -> target
            bark-loader -> target

      # ci.yml's firmware job has this step and says why.
      - name: Match libclang to clang
        run: echo "LIBCLANG_PATH=$(dirname "$(readlink -f "$(command -v clang)")")/../lib" >> "$GITHUB_ENV"

      - run: cargo build --release
        working-directory: bark-loader

      - run: cargo build --release
        working-directory: bark-fw

      # Packed straight after its build: the console build below writes
      # the same ELF. The scripts need Python 3.9 or later (bark-fw/README.md,
      # "Toolchain"), which the runner has, and the signing its
      # `cryptography` package.
      - name: Install the signing's Python package
        run: sudo apt-get update && sudo apt-get install -y python3-cryptography

      # Version 0 cannot be staged, and image.py refuses to pack it, so a
      # bench build has no image. Signed with the private key, a secret,
      # under the id this very firmware gives its public key: `--elf`
      # refuses a key the image does not hold, which would leave every
      # node it reaches unable to take the next one. The key is written
      # for the step and removed after it whatever happened, `if:
      # always()`.
      - name: Pack and sign the image to stage
        if: env.N != '0'
        working-directory: bark-fw
        env:
          KEY: ${{ secrets.BARK_SIGNING_KEY }}
        run: |
          mkdir -p ../dist
          python3 -I scripts/image.py pack "$ELF" "../dist/bark-fw-$N.img"
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/signing.pem"
          python3 -I scripts/image.py sign "../dist/bark-fw-$N.img" "$RUNNER_TEMP/signing.pem" --elf "$ELF"

      - name: Forget the image's signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.pem"

      # After the image: both UF2s write its signed header into the record,
      # so that a node flashed with either holds the release and serves it
      # over the mesh (bark-fw/README.md, "Updates"). Without it the record
      # is left erased and the node serves nothing. A bench build has no
      # image to name.
      - name: Package the node
        working-directory: bark-fw
        run: |
          mkdir -p ../dist
          header=()
          if [ "$N" != 0 ]; then
            header=(--header "../dist/bark-fw-$N.img")
          fi
          python3 -I scripts/uf2.py "${header[@]}" --loader "$LOADER" "$ELF" "../dist/bark-$N.uf2"
          python3 -I scripts/uf2.py "${header[@]}" "$ELF" "../dist/bark-fw-$N.uf2"
          python3 -I scripts/uf2.py --check "../dist/bark-$N.uf2"
          python3 -I scripts/uf2.py --check "../dist/bark-fw-$N.uf2"

      # The measurement console (bark-fw/README.md, "Console") is what the
      # bench flashes to measure the radio and to stage images. Shipping it
      # spares a person a toolchain, and it costs one more build of the
      # firmware crate alone, its dependencies already built. With the
      # loader, so it starts on any board. Open, as a bench image: it
      # opens no board a protected image has closed (bark-fw/README.md,
      # "Read-out protection").
      - run: cargo build --release --features console
        working-directory: bark-fw
        env:
          BARK_OPEN: "1"

      - name: Package the console
        working-directory: bark-fw
        run: |
          python3 -I scripts/uf2.py --loader "$LOADER" "$ELF" "../dist/bark-console-$N.uf2"
          python3 -I scripts/uf2.py --check "../dist/bark-console-$N.uf2"

      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: dist/*
          if-no-files-found: error

  android:
    name: Android
    needs: version
    if: needs.version.outputs.build_app == 'true'
    runs-on: ubuntu-latest
    env:
      N: ${{ needs.version.outputs.n }}
    defaults:
      run:
        working-directory: bark-app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('bark-app/android/**/*.gradle*', 'bark-app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      # Here as well as in ci.yml, so that no release is built from a tag
      # whose app does not pass its own checks.
      - run: flutter analyze

      - run: flutter test

      # The release key, which is the app's identity: Android takes a
      # signing certificate as *which app this is*, so an APK signed with
      # anything else cannot update an installed one. Written before the
      # build, removed after it whatever happened, `if: always()`, so that a
      # failed build does not leave a key on the runner.
      # android/app/build.gradle.kts reads it, and refuses a release build
      # in CI without it.
      - name: Unpack the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          umask 077
          echo "$KEYSTORE" | base64 -d > android/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$PASSWORD"
            echo "keyPassword=$PASSWORD"
            echo "keyAlias=$ALIAS"
          } > android/key.properties

      # The app learns its version, N here, from BARK_VERSION
      # (lib/releases.dart, appVersion) rather than from the version code:
      # a build from a checkout has pubspec.yaml's code 1 and no
      # BARK_VERSION, which the app reads as 0, a development build that
      # never asks to be updated. Read again from the release's manifest
      # as `app` while later releases carry this APK on.
      - run: flutter build apk --release --build-name="$N" --build-number="$N" --dart-define=BARK_VERSION="$N"

      # Proved, not assumed: compare the APK's certificate with the
      # keystore's, and fail if they differ. An APK shipped under the wrong
      # key is one nobody can update from.
      - name: Check the APK carries the release certificate
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          got=$("$apksigner" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk \
            | sed -n 's/.*SHA-256 digest: //p' | head -1)
          want=$(keytool -list -v -keystore android/release.jks \
            -alias "$(sed -n 's/^keyAlias=//p' android/key.properties)" \
            -storepass "$(sed -n 's/^storePassword=//p' android/key.properties)" \
            | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          if [ -z "$want" ] || [ "$got" != "$want" ]; then
            echo "signed by $got, expected $want"
            exit 1
          fi
          echo "signed by the release key ($got)"

      - name: Forget the signing key
        if: always()
        run: rm -f android/release.jks android/key.properties

      - run: mv build/app/outputs/flutter-apk/app-release.apk "bark-$N.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: bark-app/bark-${{ env.N }}.apk
          if-no-files-found: error

  # Runs when a side was skipped as unchanged too, but not after a failure.
  release:
    name: GitHub Release
    if: github.ref_type == 'tag' && !cancelled() && !failure()
    needs: [version, firmware, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      N: ${{ needs.version.outputs.n }}
      F: ${{ needs.version.outputs.firmware }}
      A: ${{ needs.version.outputs.app }}
      PREV: ${{ needs.version.outputs.prev }}
      BUILD_FIRMWARE: ${{ needs.version.outputs.build_firmware }}
      BUILD_APP: ${{ needs.version.outputs.build_app }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # The previous release's files of a side that did not change, the
      # very bytes: the image is the one nodes already hold, signed then.
      - name: Carry the unchanged side's files on
        run: |
          if [ "$BUILD_FIRMWARE" != true ]; then
            mkdir -p artifacts/firmware
            gh release download "v$PREV" -D artifacts/firmware \
              -p "bark-$F.uf2" -p "bark-fw-$F.uf2" -p "bark-fw-$F.img" \
              -p "bark-console-$F.uf2"
          fi
          if [ "$BUILD_APP" != true ]; then
            mkdir -p artifacts/android
            gh release download "v$PREV" -D artifacts/android -p "bark-$A.apk"
          fi
          for f in "firmware/bark-$F.uf2" "firmware/bark-fw-$F.uf2" \
            "firmware/bark-fw-$F.img" "firmware/bark-console-$F.uf2" \
            "android/bark-$A.apk"; do
            [ -s "artifacts/$f" ] || { echo "missing $f"; exit 1; }
          done

      # What the app reads to learn the versions (bark-app/lib/releases.dart).
      - name: Write the manifest
        run: |
          mkdir -p artifacts/manifest
          jq -n --argjson release "$N" --argjson app "$A" --argjson firmware "$F" \
            '{release: $release, app: $app, firmware: $firmware}' \
            > artifacts/manifest/release.json
          cat artifacts/manifest/release.json

      - name: Create the release
        run: |
          if [ "$BUILD_FIRMWARE" = true ]; then
            fw_since=", new in this release"
          else
            fw_since=", unchanged since release $F"
          fi
          if [ "$BUILD_APP" = true ]; then
            app_since=", new in this release"
          else
            app_since=", unchanged since release $A"
          fi
          cat > notes.md <<'NOTES'
          ## Versions

          | Part | Version |
          |---|---|
          | Node firmware | @F@@FW_SINCE@ |
          | App | @A@@APP_SINCE@ |

          A part that did not change since an earlier release keeps that
          release's files and version, so a node or a phone already on it
          has nothing to update.

          ## Downloads

          | File | For |
          |---|---|
          | `bark-@F@.uf2` | a T-Echo's first flash: the loader and the node firmware, which holds this firmware and serves it to other nodes over the mesh |
          | `bark-fw-@F@.uf2` | a T-Echo that already runs bark: the node firmware alone, which holds and serves this firmware as `bark-@F@.uf2` does |
          | `bark-fw-@F@.img` | the node firmware as an image to stage through the console's serial port, signed with the project's key (`bark-fw/README.md`, "Updates") |
          | `bark-console-@F@.uf2` | the measurement console in place of the node, with the loader, for the bench (`bark-fw/README.md`, "Console") |
          | `bark-@A@.apk` | the Android app, which links a phone to its node over Bluetooth |
          | `bark.apk`, `bark.uf2` | `bark-@A@.apk` and `bark-@F@.uf2` under names that stay the same, so that a link to the latest release's file always works (the project's page links `bark.apk`) |
          | `release.json` | this release's number and the app's and the firmware's versions, which the app reads to tell what is newer |

          ## Flashing a T-Echo

          1. Connect it over USB. Double-tap its reset button, the top-left
             one, within half a second: a drive named `TECHOBOOT` appears.
          2. Copy `bark-@F@.uf2` to it. The board restarts into the firmware
             when the copy is complete.

          A board that already runs bark needs only `bark-fw-@F@.uf2`, and
          enters the bootloader without the button when its serial port is
          set to 1200 baud (`stty -F /dev/ttyACM0 1200` on Linux).
          `bark-fw/README.md`, "Flash", has the details.

          ## The app

          Messages are not encrypted yet: anyone in radio range of a node
          on the way can read them. Do not send anything private.

          The APK is signed with the project's release key, so each release
          installs over the one before. An app built elsewhere is signed
          with another key: uninstall it first.
          NOTES
          sed -i -e "s/@F@/$F/g" -e "s/@A@/$A/g" \
            -e "s/@FW_SINCE@/$fw_since/" -e "s/@APP_SINCE@/$app_since/" notes.md
          # Draft, upload, publish: three steps because `gh release create`
          # with the files on the end creates the release first and then
          # uploads one file at a time, so a failed upload leaves a public
          # release missing files, and a retry fails at `create` with
          # `already_exists` without attaching the rest. This way nothing
          # is visible until every file is attached, and running the job
          # again ends in the same place.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft \
              --title "$GITHUB_REF_NAME" \
              --notes-file notes.md
          fi
          cp "artifacts/android/bark-$A.apk" artifacts/android/bark.apk
          cp "artifacts/firmware/bark-$F.uf2" artifacts/firmware/bark.uf2
          gh release upload "$GITHUB_REF_NAME" artifacts/*/* --clobber
          gh release edit "$GITHUB_REF_NAME" \
            --draft=false --notes-file notes.md
